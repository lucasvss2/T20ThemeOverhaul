name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Run JS-based actions on Node 24 (Node 20 is deprecated on GitHub runners).
    # Covers softprops/action-gh-release@v2 regardless of its pinned runtime.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Strip leading "v"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Patch version and download URL in module.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          jq \
            --arg v "$VERSION" \
            --arg dl "https://github.com/${{ github.repository }}/releases/download/$TAG/t20-theme-overhaul.zip" \
            '.version = $v | .download = $dl' \
            module.json > module.patched.json
          mv module.patched.json module.json

      - name: Build compendium packs
        run: npm run build:packs

      - name: Create ZIP
        run: |
          mkdir -p staging/t20-theme-overhaul
          cp module.json           staging/t20-theme-overhaul/module.json
          cp dist/main.bundle.js   staging/t20-theme-overhaul/main.bundle.js
          # Assets (PNGs, ícones, etc.) — vite.config.ts copia public/ pra dist/
          if [ -d dist/assets ]; then
            cp -r dist/assets staging/t20-theme-overhaul/assets
          fi
          # Templates .hbs (ex.: T20OverhaulTab) — mesma origem, public/templates/
          if [ -d dist/templates ]; then
            cp -r dist/templates staging/t20-theme-overhaul/templates
          fi
          # Compêndios do módulo (LevelDB compilado de packs-src/ pelo build:packs)
          if [ -d packs ]; then
            cp -r packs staging/t20-theme-overhaul/packs
          fi
          cd staging
          zip -r ../t20-theme-overhaul.zip t20-theme-overhaul/
          cd ..
          echo "ZIP contents:"
          unzip -l t20-theme-overhaul.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: t20-theme-overhaul.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
